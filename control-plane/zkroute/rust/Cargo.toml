[package]
name = "veriroute_route"
version = "0.1.0"
edition = "2021"
default-run = "veriroute_route"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
plonky2 = "=1.1.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

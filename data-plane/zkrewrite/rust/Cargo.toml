[package]
name = "veriroute-rewrite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast recursive aggregation (fixed fan-in) using Plonky2 (no local vendor)."

[dependencies]
rayon = "1.7"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Plonky2 stack (no vendor). You can pin versions/revs as you like.
plonky2 = "=1.1.0"

[profile.release]
lto = true
codegen-units = 1


